---
argument_specs:
  main:
    short_description: Harden the dedicated Ansible WinRM service account.
    options:
      winrm_service_account_forbid_builtin_admin:
        type: bool
        default: true
        description: Fail if Ansible connects as the built-in Administrator (RID 500).
      winrm_service_account_deny_interactive_logon:
        type: bool
        default: true
        description: Add the account to "Deny log on locally" (SeDenyInteractiveLogonRight).
      winrm_service_account_deny_rdp_logon:
        type: bool
        default: true
        description: Add the account to "Deny log on through Remote Desktop Services".
