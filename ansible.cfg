# NOTE: Ansible IGNORES this file if the directory is world-writable
# (e.g. a project sitting on /mnt/c inside WSL). Copy the project into
# your Linux home directory (~/ansible-project) before running.

[defaults]
inventory              = ./inventory/hosts.yml
roles_path             = ./roles
collections_path       = ./collections:~/.ansible/collections:/usr/share/ansible/collections
retry_files_enabled    = False
callback_result_format = yaml
forks                  = 10
timeout                = 60
# Windows hosts do not use Python; silences interpreter discovery noise
# for the controller-side (delegate_to: localhost) checks.
interpreter_python     = auto_silent
